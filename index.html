<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Akidoro - a distraction-free Pomodoro timer with weekly statistics, optional Google sign-in and link-based music."
    />
    <meta name="theme-color" content="#3e6745" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <title>Akidoro</title>
    <script>
      // Apply the persisted theme before paint to avoid a flash.
      // Reads Akidoro keys and falls back to the pre-rename FocusTime keys.
      (function () {
        try {
          var theme = localStorage.getItem('akidoro.theme.v1') || localStorage.getItem('focustime.theme.v1');
          if (!theme) {
            var raw = localStorage.getItem('akidoro.settings.v1') || localStorage.getItem('focustime.settings.v1');
            theme = raw ? JSON.parse(raw).theme : 'system';
          }
          var dark =
            theme === 'dark' ||
            ((!theme || theme === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
